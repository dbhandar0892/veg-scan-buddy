<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VegSeal</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0f1a14;
        color: #e8f5ee;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
      }
      .wrap { padding: 24px; max-width: 320px; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { font-size: 15px; line-height: 1.5; opacity: 0.8; margin: 0 0 20px; }
      button {
        background: #2fbf71; color: #06170f; border: 0; border-radius: 999px;
        padding: 12px 24px; font-size: 15px; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>VegSeal</h1>
      <p>We couldn't reach VegSeal. Check your internet connection and try again.</p>
      <button onclick="location.href='https://vegseal.com'">Try again</button>
    </div>
  </body>
</html>
