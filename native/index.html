<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>VegSeal</title>
    <style>
      html,body{margin:0;height:100%;background:#0f1a14;color:#e8f5ee;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;align-items:center;justify-content:center;text-align:center}
      .wrap{padding:28px;max-width:340px}
      .icon{font-size:56px}
      h1{font-size:24px;margin:12px 0 8px}
      p{font-size:15px;line-height:1.5;opacity:.8;margin:0 0 20px}
      ul{text-align:left;font-size:14px;opacity:.85;line-height:1.7;padding-left:20px;margin:0 0 24px}
      button{background:#2fbf71;color:#06170f;border:0;border-radius:999px;padding:14px 28px;font-size:16px;font-weight:600}
      .status{margin-top:16px;font-size:13px;opacity:.6}
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="icon">🌱</div>
      <h1>You're offline</h1>
      <p>VegSeal needs internet to check ingredients against our library and manufacturer sources.</p>
      <ul>
        <li>Turn off Airplane Mode</li>
        <li>Connect to Wi-Fi or mobile data</li>
      </ul>
      <button id="retry">Try again</button>
      <div class="status" id="st">We'll reconnect automatically.</div>
    </div>
    <script>
      var go=function(){location.href='https://vegseal.com'};
      document.getElementById('retry').onclick=function(){
        try{window.Capacitor&&Capacitor.Plugins.Haptics&&Capacitor.Plugins.Haptics.impact({style:'MEDIUM'})}catch(e){}
        document.getElementById('st').textContent='Reconnecting…';go();
      };
      window.addEventListener('online',go);
      setInterval(function(){if(navigator.onLine){fetch('https://vegseal.com/',{mode:'no-cors',cache:'no-store'}).then(go).catch(function(){})}},5000);
    </script>
  </body>
</html>
